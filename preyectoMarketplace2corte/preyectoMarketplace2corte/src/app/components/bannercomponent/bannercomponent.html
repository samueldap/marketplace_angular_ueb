<section class="hero-section d-flex align-items-center text-white position-relative">

  <div class="hero-overlay position-absolute top-0 start-0 w-100 h-100"></div>

  <div class="container position-relative z-2 text-start py-5">

    <div class="row align-items-center">
      <div class="col-lg-6">
        <h1 class="display-4 fw-bold mb-3 animate__animated animate__fadeInDown">Encuentra tu próxima <em>GRAN aventura</em></h1>
        <p class="lead mb-5 animate__animated animate__fadeInUp">Descubre alojamientos únicos, destinos mágicos y experiencias inolvidables en Nidus.</p>
      </div>

      <div class="col-lg-5 offset-lg-1 animate__animated animate__fadeInUp">
        <div class="card p-3 shadow-lg border-0 rounded-4 bg-white text-dark">
          <form class="row g-3 align-items-center">

            <div class="col-12 text-start">
              <label class="form-label fw-bold text-muted small text-uppercase">Destino</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-geo-alt-fill text-danger"></i></span>
                <input type="text" class="form-control bg-light border-0" placeholder="¿A dónde viajas?">
              </div>
            </div>

            <div class="col-6 text-start">
              <label class="form-label fw-bold text-muted small text-uppercase">LLegada</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-calendar-event-fill text-danger"></i></span>
                <input type="date" class="form-control bg-light border-0">
              </div>
            </div>

            <div class="col-6 text-start">
              <label class="form-label fw-bold text-muted small text-uppercase">Salida</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-calendar-event-fill text-danger"></i></span>
                <input type="date" class="form-control bg-light border-0">
              </div>
            </div>

            <div class="col-12 text-start">
              <label class="form-label fw-bold text-muted small text-uppercase">Huéspedes</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-people-fill text-danger"></i></span>
                <select class="form-select bg-light border-0">
                  <option selected>1 Huésped</option>
                  <option value="1">2 Huéspedes</option>
                  <option value="2">3+ Huéspedes</option>
                </select>
              </div>
            </div>

            <div class="col-12 d-grid">
              <button type="submit" class="btn btn-danger py-2 fw-bold shadow-sm">
                <i class="bi bi-search me-1"></i> Buscar
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</section>
